services:
  postgres:
    image: postgres:16-alpine
    container_name: sc-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: superchampions
      POSTGRES_PASSWORD: superchampions
      POSTGRES_DB: superchampions
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U superchampions" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sc-backend
    restart: unless-stopped
    ports:
      - "7182:7182"
    environment:
      DATABASE_URL: postgresql://superchampions:superchampions@postgres:5432/superchampions
      PORT: 7182
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/backend/src
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sc-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:7182/api
    volumes:
      - ./frontend/src:/app/frontend/src
    depends_on:
      - backend

volumes:
  postgres_data:
